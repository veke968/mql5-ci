name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Download MT5
        shell: pwsh
        run: |
          $urls = @(
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe",
            "https://download.mql5.com/cdn/mt5setup.exe"
          )
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              Invoke-WebRequest -Uri $url -OutFile "mt5setup.exe" -TimeoutSec 180
              $size = (Get-Item "mt5setup.exe").Length
              Write-Host "Downloaded: $size bytes"
              if ($size -gt 1000000) { break }
            } catch { Write-Host "Failed: $_" }
          }
          if (-not (Test-Path "mt5setup.exe") -or (Get-Item "mt5setup.exe").Length -lt 1000000) {
            Write-Host "ERROR: Download failed"; exit 1
          }

      - name: Extract MT5 via 7zip
        shell: pwsh
        run: |
          # Install 7zip
          choco install 7zip -y --no-progress 2>$null | Out-Null
          
          $installPath = "C:\MetaTrader5"
          New-Item -ItemType Directory -Force -Path $installPath | Out-Null
          
          # Extract installer with 7z (bypasses GUI install)
          & 7z x mt5setup.exe -o"$installPath" -y 2>&1
          Start-Sleep -Seconds 10
          
          Write-Host "=== Extracted files ==="
          Get-ChildItem $installPath -Recurse -Depth 2 | Select-Object -First 30 | ForEach-Object {
            Write-Host "  $($_.FullName) ($($_.Length) bytes)"
          }
          
          $me = Get-ChildItem $installPath -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue -Depth 3 | Select-Object -First 1
          if ($me) {
            Write-Host "SUCCESS: $($me.FullName) ($($me.Length) bytes)"
          } else {
            Write-Host "metaeditor64.exe not found"; exit 1
          }
          echo "ME_PATH=$($me.FullName)" >> $env:GITHUB_ENV

      - name: Compile
        shell: pwsh
        run: |
          $me = $env:ME_PATH
          if (-not $me) { Write-Host "No ME_PATH"; exit 1 }
          
          $src = Get-ChildItem . -Filter "*.mq5" -Recurse | Select-Object -First 1
          if (-not $src) { Write-Host "No .mq5"; exit 1 }
          Write-Host "Compiling: $($src.FullName)"
          
          $log = "$PWD\compile.log"
          $proc = Start-Process -FilePath $me `
            -ArgumentList "/compile:$($src.FullName)", "/log:$log" `
            -NoNewWindow -Wait -PassThru
          Write-Host "Exit: $($proc.ExitCode)"
          
          if (Test-Path $log) {
            Write-Host "=== Log ==="
            Get-Content $log
          }
          
          $ex5 = $src.FullName -replace '\.mq5$', '.ex5'
          if (Test-Path $ex5) {
            Write-Host "SUCCESS: $(($ex5)) ($((Get-Item $ex5).Length) bytes)"
          } else {
            $found = Get-ChildItem . -Filter "*.ex5" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Write-Host "EX5: $($found.FullName)" }
            else { Write-Host "ERROR: No EX5"; exit 1 }
          }

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ea
          path: "**/*.ex5"
          if-no-files-found: error
          retention-days: 30
