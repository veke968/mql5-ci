name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine and Download MT5
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends wine64 wine32 xvfb
          
          echo "Downloading MT5..."
          curl -L -o /tmp/mt5setup.exe "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          
          echo "Installing MT5 via Wine..."
          export WINEARCH=win64
          export WINEPREFIX=/tmp/wine-prefix
          xvfb-run wine /tmp/mt5setup.exe /portable /config=install_path="C:\\MetaTrader5" || true
          
          for i in $(seq 1 120); do
            if [ -f "$WINEPREFIX/drive_c/MetaTrader5/metaeditor64.exe" ]; then
              echo "MT5 found!"
              break
            fi
            sleep 5
          done
          
          echo "=== Wine prefix ==="
          find "$WINEPREFIX/drive_c/" -name "metaeditor64.exe" 2>/dev/null || echo "Not found"
          find "$WINEPREFIX/drive_c/" -name "*.exe" 2>/dev/null | head -10 || true

      - name: Compile MQ5
        id: compile
        run: |
          export WINEPREFIX=/tmp/wine-prefix
          export MT5_DIR="$WINEPREFIX/drive_c/MetaTrader5"
          
          mkdir -p "$MT5_DIR/MQL5/Experts"
          cp "Experts/"* "$MT5_DIR/MQL5/Experts/" 2>/dev/null || true
          
          echo "=== Starting compilation ==="
          xvfb-run wine "$MT5_DIR/metaeditor64.exe" \
            /compile:"$MT5_DIR/MQL5/Experts/中期汇看盘软件 MT5.mq5" \
            /log:compile.log 2>&1 || true
          
          LOG=$(cat compile.log 2>/dev/null || echo "No log")
          echo "log<<LOGEOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "LOGEOF" >> $GITHUB_OUTPUT
          
          echo "=== Compile log ==="
          echo "$LOG"
          
          echo "=== EX5 files ==="
          find "$MT5_DIR" -name "*.ex5" 2>/dev/null || echo "No EX5"
          
          if echo "$LOG" | grep -qi "error"; then
            echo "=== Compilation FAILED ==="
            exit 1
          fi

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log
