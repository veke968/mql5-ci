name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: fx369/mql5-build:latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Compile MQ5
        run: |
          mkdir -p /tmp/mql5-ci-output
          
          echo "=== Compiling 中期汇看盘软件 MT5.mq5 ==="
          wine "/opt/MetaTrader 5/metaeditor64.exe" \
            /compile:"/github/workspace/Experts/中期汇看盘软件 MT5.mq5" \
            /log:/tmp/mql5-ci-output/compile.log 2>&1 || true
          
          echo "=== Compile Log ==="
          cat /tmp/mql5-ci-output/compile.log 2>/dev/null || echo "No log"
          
          echo "=== EX5 Check ==="
          EX5_COUNT=$(find /opt -name "*.ex5" 2>/dev/null | wc -l)
          echo "Found $EX5_COUNT .ex5 files"
          find /opt -name "*.ex5" 2>/dev/null | head -10
          
          if [ "$EX5_COUNT" -eq 0 ]; then
            echo "ERROR: No EX5 generated"
            exit 1
          fi
          echo "SUCCESS: EX5 generated"
