name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Compile MQL5
        uses: fx31337/mql-compile-action@v1.0.0
        with:
          path: '.'
          include: '.'
          init-platform: true
          verbose: true

      - name: Show compile log
        if: always()
        run: |
          if (Test-Path "mql.log") {
            Get-Content "mql.log"
          }
          $ex5Files = Get-ChildItem -Path . -Filter "*.ex5" -Recurse -ErrorAction SilentlyContinue
          if ($ex5Files) {
            Write-Host "=== Generated EX5 files ==="
            $ex5Files | ForEach-Object { Write-Host "$($_.FullName) ($($_.Length) bytes)" }
          } else {
            Write-Host "No EX5 files found"
          }

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ea
          path: "**/*.ex5"
          if-no-files-found: warn
          retention-days: 30
