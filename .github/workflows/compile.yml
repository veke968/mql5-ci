name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Compile MQL5
        uses: denniswilsmann/mql5-compile-action@v1
        with:
          filename: Experts/中期汇看盘软件 MT5.mq5
          output: compiled/
          compiler_version: 4090

      - name: Show Results
        if: always()
        run: |
          echo "=== Compiled Files ==="
          ls -la compiled/ 2>/dev/null || echo "No compiled directory"
          find . -name "*.ex5" -ls 2>/dev/null || echo "No EX5 files"
