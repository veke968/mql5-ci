name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: fx369/mql5-build:latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Compile MQ5
        run: |
          set -e
          # Find .mq5 file
          MQ5_FILE=$(find . -name "*.mq5" -type f | head -1)
          if [ -z "$MQ5_FILE" ]; then
            echo "ERROR: No .mq5 file found!"
            exit 1
          fi
          echo "Found: $MQ5_FILE"
          echo "Compiling..."

          # Try wine metaeditor64.exe (container should have it)
          wine metaeditor64.exe /compile:"$MQ5_FILE" /log:compile.log 2>&1 || true

          if [ -f compile.log ]; then
            echo "=== Compile Log ==="
            cat compile.log
          fi

          EX5_FILE="${MQ5_FILE%.mq5}.ex5"
          if [ -f "$EX5_FILE" ]; then
            echo "SUCCESS: $EX5_FILE generated"
            ls -la "$EX5_FILE"
          else
            FOUND=$(find . -name "*.ex5" -type f | head -1)
            if [ -n "$FOUND" ]; then
              echo "EX5 found: $FOUND"
            else
              echo "ERROR: No EX5 generated"
              exit 1
            fi
          fi

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ea
          path: "**/*.ex5"
          if-no-files-found: error
          retention-days: 30
