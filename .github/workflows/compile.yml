name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download MT5
        shell: pwsh
        run: |
          Write-Host "Downloading MT5 installer..."
          $urls = @(
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe",
            "https://download.mql5.com/cdn/mt5setup.exe"
          )
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              Invoke-WebRequest -Uri $url -OutFile "mt5setup.exe" -TimeoutSec 120
              $size = (Get-Item "mt5setup.exe").Length
              Write-Host "Downloaded: $size bytes"
              if ($size -gt 1000000) { break }
            } catch {
              Write-Host "Failed: $_"
            }
          }
          if (-not (Test-Path "mt5setup.exe") -or (Get-Item "mt5setup.exe").Length -lt 1000000) {
            Write-Host "ERROR: Failed to download MT5"
            exit 1
          }

      - name: Install MT5
        shell: pwsh
        run: |
          Write-Host "Installing MT5..."
          $installPath = "C:\MetaTrader5"
          $process = Start-Process -FilePath "mt5setup.exe" `
            -ArgumentList "/INSTALL", "/SILENT", "/NORESTART", "/DIR=$installPath" `
            -NoNewWindow -Wait -PassThru
          Write-Host "Installer exit: $($process.ExitCode)"
          Start-Sleep -Seconds 30
          if (Test-Path $installPath) {
            Write-Host "Installed to: $installPath"
            Get-ChildItem $installPath -Depth 1 | ForEach-Object { Write-Host "  $_" }
          }

      - name: Find Compiler
        shell: pwsh
        run: |
          $searchPaths = @(
            "C:\MetaTrader5",
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5"
          )
          $me = $null
          foreach ($basePath in $searchPaths) {
            if (Test-Path $basePath) {
              $me = Get-ChildItem -Path $basePath -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue -Depth 3 | Select-Object -First 1
              if ($me) { break }
              $me = Get-ChildItem -Path $basePath -Filter "metaeditor.exe" -Recurse -ErrorAction SilentlyContinue -Depth 3 | Select-Object -First 1
              if ($me) { break }
            }
          }
          if (-not $me) {
            Write-Host "ERROR: No compiler found!"
            foreach ($p in $searchPaths) {
              if (Test-Path $p) {
                Get-ChildItem -Path $p -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue -Depth 3 | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName)" }
              }
            }
            exit 1
          }
          Write-Host "Found: $($me.FullName)"
          echo "COMPILER=$($me.FullName)" >> $env:GITHUB_ENV

      - name: Compile
        shell: pwsh
        run: |
          $compiler = $env:COMPILER
          $srcFile = Get-ChildItem -Path . -Filter "*.mq5" -Recurse | Select-Object -First 1
          if (-not $srcFile) { Write-Host "No .mq5"; exit 1 }
          Write-Host "Compiling: $($srcFile.FullName)"
          
          $compileLog = "$PWD\compile.log"
          $process = Start-Process -FilePath $compiler `
            -ArgumentList "/compile:$($srcFile.FullName)", "/log:$compileLog" `
            -NoNewWindow -Wait -PassThru
          Write-Host "Exit: $($process.ExitCode)"
          
          if (Test-Path $compileLog) {
            Write-Host "=== Log ==="
            Get-Content $compileLog
          }
          
          $ex5File = $srcFile.FullName -replace '\.mq5$', '.ex5'
          if (Test-Path $ex5File) {
            Write-Host "SUCCESS: $ex5File ($((Get-Item $ex5File).Length) bytes)"
          } else {
            $found = Get-ChildItem -Path . -Filter "*.ex5" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Write-Host "EX5: $($found.FullName)" }
            else { Write-Host "ERROR: No EX5"; exit 1 }
          }

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ea
          path: "**/*.ex5"
          if-no-files-found: error
          retention-days: 30
