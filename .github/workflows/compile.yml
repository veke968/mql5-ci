name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine and Download MT5
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends wine64 wine32 xvfb
          
          wine --version || true
          
          curl -L -o /tmp/mt5setup.exe "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          
          export WINEARCH=win64
          export WINEPREFIX=/tmp/wine-prefix
          xvfb-run -s "-screen 0 1024x768x24" wine /tmp/mt5setup.exe /portable /config=install_path="C:\\MetaTrader5" 2>&1 &
          WINE_PID=$!
          
          for i in $(seq 1 120); do
            if ! kill -0 $WINE_PID 2>/dev/null; then break; fi
            sleep 5
          done
          
          wait $WINE_PID 2>/dev/null || true
          
          if [ ! -f "/tmp/wine-prefix/drive_c/MetaTrader5/metaeditor64.exe" ]; then
            echo "MT5_INSTALL_FAILED" > /tmp/compile_result.txt
            exit 0  # Don't fail here, we'll report it
          fi

      - name: Compile MQ5
        run: |
          export WINEPREFIX=/tmp/wine-prefix
          export MT5_DIR="$WINEPREFIX/drive_c/MetaTrader5"
          
          if [ ! -f "$MT5_DIR/metaeditor64.exe" ]; then
            echo "MT5_NOT_INSTALLED" > /tmp/compile_result.txt
            echo "ERROR: metaeditor64.exe not found"
            exit 0
          fi
          
          mkdir -p "$MT5_DIR/MQL5/Experts"
          cp "Experts/"* "$MT5_DIR/MQL5/Experts/" 2>/dev/null || true
          
          xvfb-run -s "-screen 0 1024x768x24" wine "$MT5_DIR/metaeditor64.exe" \
            /compile:"$MT5_DIR/MQL5/Experts/中期汇看盘软件 MT5.mq5" \
            /log:compile.log 2>&1 || true
          
          if [ -f compile.log ]; then
            cp compile.log /tmp/compile_result.txt
          else
            echo "NO_COMPILE_LOG" > /tmp/compile_result.txt
          fi
          
          echo "=== Compile Log ==="
          cat /tmp/compile_result.txt

      - name: Create Issue with Compile Log
        if: always()
        uses: peter-evans/create-or-update-issue@v4
        with:
          title: "MQL5 Compile Log - ${{ github.run_id }}"
          body: |
            ## Compile Result
            ```
            ${{ steps.compile.outputs.log || 'No log available' }}
            ```
          labels: compile-log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload via API
        if: always()
        run: |
          LOG=$(cat /tmp/compile_result.txt 2>/dev/null | head -100)
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{
              \"title\": \"MQL5 Compile Log - ${{ github.run_id }}\",
              \"body\": \"\`\`\`\\n$LOG\\n\`\`\`\"
            }"
