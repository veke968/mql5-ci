name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable xvfb
          wine --version

      - name: Download and Install MT5
        run: |
          curl -L -o /tmp/mt5setup.exe "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          export WINEARCH=win64
          export WINEPREFIX=$HOME/.wine-mt5
          xvfb-run -s "-screen 0 1024x768x24" wine /tmp/mt5setup.exe /portable /config=install_path="C:\\MetaTrader5" || true
          
          for i in $(seq 1 60); do
            if [ -f "$WINEPREFIX/drive_c/MetaTrader5/metaeditor64.exe" ]; then
              echo "MT5 installation found!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 10
          done

      - name: Compile MQ5
        run: |
          export WINEPREFIX=$HOME/.wine-mt5
          MT5_DIR="$WINEPREFIX/drive_c/MetaTrader5"
          
          mkdir -p "$MT5_DIR/MQL5/Experts"
          cp "Experts/"* "$MT5_DIR/MQL5/Experts/" 2>/dev/null || true
          
          echo "=== Starting Compilation ==="
          xvfb-run -s "-screen 0 1024x768x24" wine "$MT5_DIR/metaeditor64.exe" \
            /compile:"$MT5_DIR/MQL5/Experts/中期汇看盘软件 MT5.mq5" \
            /log:compile.log
          
          echo "=== Compile Log ==="
          cat compile.log 2>/dev/null || echo "No compile log"
          
          echo "=== Check for EX5 ==="
          find "$MT5_DIR" -name "*.ex5" -ls 2>/dev/null || echo "No EX5 found"
          
          # Check for errors in log
          if grep -qi "error" compile.log 2>/dev/null; then
            echo "=== ERRORS FOUND ==="
            grep -i "error" compile.log
            exit 1
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-results
          path: |
            compile.log
            **/*.ex5
