name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download MT5 Installer
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/metaeditor5setup.exe" -OutFile "mt5setup.exe"
          Write-Host "Download complete: $(Get-Item mt5setup.exe | Measure-Object -Property Length -Sum | Select -Expand Sum) bytes"

      - name: Install MT5 (Silent)
        run: |
          Start-Process -FilePath "mt5setup.exe" -ArgumentList "/install","/quiet" -NoNewWindow -Wait
          # Find metaeditor64.exe
          $me = Get-ChildItem -Path "C:\Program Files\MetaTrader 5" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue -Depth 3 | Select-Object -First 1
          if (-not $me) {
            $me = Get-ChildItem -Path "$env:LOCALAPPDATA\MetaTrader 5" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue -Depth 3 | Select-Object -First 1
          }
          if (-not $me) {
            Write-Host "ERROR: metaeditor64.exe not found!"
            Get-ChildItem -Path "C:\Program Files" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue -Depth 5 | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }
          Write-Host "Found metaeditor64.exe: $($me.FullName)"
          echo "ME_PATH=$($me.FullName)" >> $env:GITHUB_ENV

      - name: Compile MQ5
        run: |
          # Find the .mq5 file
          $srcFiles = Get-ChildItem -Path . -Filter "*.mq5" -Recurse
          if ($srcFiles.Count -eq 0) {
            Write-Host "ERROR: No .mq5 file found!"
            exit 1
          }
          $srcFile = $srcFiles | Select-Object -First 1
          Write-Host "Compiling: $($srcFile.Name) at $($srcFile.FullName)"

          $mePath = $env:ME_PATH
          $compileLog = "$PWD\compile.log"

          # Run compilation
          $process = Start-Process -FilePath $mePath -ArgumentList "/compile:$($srcFile.FullName)", "/log:$compileLog" -NoNewWindow -Wait -PassThru
          Write-Host "Exit code: $($process.ExitCode)"

          # Show log
          if (Test-Path $compileLog) {
            Write-Host "=== Compile Log ==="
            Get-Content $compileLog
          }

          # Check for EX5 output
          $ex5File = $srcFile.FullName -replace '\.mq5$', '.ex5'
          Write-Host "Expected EX5 path: $ex5File"

          if (Test-Path $ex5File) {
            Write-Host "SUCCESS: EX5 generated at $ex5File"
            Write-Host "File size: $((Get-Item $ex5File).Length) bytes"
          } else {
            # Search for any .ex5
            $anyEx5 = Get-ChildItem -Path . -Filter "*.ex5" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($anyEx5) {
              Write-Host "EX5 found at: $($anyEx5.FullName)"
            } else {
              Write-Host "ERROR: No EX5 file generated! Check compile log for errors."
              exit 1
            }
          }

          # Fail on any compile errors in the log
          if (Test-Path $compileLog) {
            $errors = Select-String -Path $compileLog -Pattern "error" -CaseSensitive:$false
            if ($errors) {
              Write-Host "ERROR: Compile log contains errors:"
              $errors | ForEach-Object { Write-Host $_.Line }
              exit 1
            }
          }

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ea
          path: "*.ex5"
          if-no-files-found: error
          retention-days: 30
