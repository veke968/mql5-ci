name: MQL5 Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Compile MQL5 with Docker
        uses: denniswilsmann/mql5-compile-action@v1
        with:
          compile-file-name: 中期汇看盘软件 MT5.mq5

      - name: Upload Compile Result
        run: |
          mkdir -p ci-results
          ls -la *.log 2>/dev/null || echo "No log files"
          ls -la *.ex5 2>/dev/null || echo "No EX5 files"
          ls -la /home/runner/work/mql5-ci/mql5-ci/Experts/ 2>/dev/null || true
          
          # Copy any output files
          find /home/runner/work/mql5-ci/ -name "*.log" -exec cp {} ci-results/ \; 2>/dev/null || true
          find /home/runner/work/mql5-ci/ -name "*.ex5" -exec cp {} ci-results/ \; 2>/dev/null || true
          
          # Check if compilation was successful
          if find /home/runner/work/mql5-ci/ -name "*.ex5" 2>/dev/null | grep -q .; then
            echo "✅ Compilation SUCCESS - EX5 file generated"
          else
            echo "❌ Compilation FAILED - no EX5 file generated"
            exit 1
          fi

      - name: Commit Compile Result
        if: always()
        run: |
          git config --global user.name "MQL5 CI Bot"
          git config --global user.email "ci@mql5.local"
          
          git add -A
          git commit -m "CI compile result - run ${{ github.run_id }}" || echo "No changes to commit"
          git push origin main || echo "Push failed"
